<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>hermes-routines banner</title>
  <desc>Schematic illustration, not a pixel capture: banner for hermes-routines showing the Routines page at /routines backed by host cron.manage. MIT licensed, pre-release.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>
  <text x="80" y="190" font-size="30" fill="#38bdf8" letter-spacing="4">HERMES DESKTOP PLUGIN</text>
  <text x="76" y="300" font-size="96" font-weight="700" fill="#f1f5f9">hermes-routines</text>
  <text x="80" y="368" font-size="30" fill="#e2e8f0">Routines page at /routines, backed by host cron.manage.</text>
  <text x="80" y="412" font-size="24" fill="#94a3b8">View, search, filter, inspect, create, pause, and resume scheduled routines.</text>
  <g font-size="24" font-weight="600">
    <rect x="80" y="460" width="92" height="48" rx="10" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="104" y="491" fill="#e2e8f0">MIT</text>
    <rect x="188" y="460" width="168" height="48" rx="10" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <text x="212" y="491" fill="#e2e8f0">pre-release</text>
  </g>
  <g>
    <rect x="760" y="120" width="360" height="390" rx="16" fill="#020617" stroke="#334155" stroke-width="2"/>
    <rect x="760" y="120" width="360" height="64" rx="16" fill="#1e293b"/>
    <circle cx="792" cy="152" r="8" fill="#38bdf8"/>
    <circle cx="816" cy="152" r="8" fill="#334155"/>
    <circle cx="840" cy="152" r="8" fill="#334155"/>
    <text x="872" y="160" font-size="22" fill="#f1f5f9" font-weight="600">Routines</text>
    <rect x="788" y="208" width="304" height="44" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="806" y="237" font-size="20" fill="#94a3b8">Search routines…</text>
    <g font-size="19">
      <rect x="788" y="268" width="184" height="40" rx="20" fill="#0ea5e9"/>
      <text x="812" y="295" fill="#020617" font-weight="700">Morning briefing</text>
      <rect x="788" y="320" width="196" height="40" rx="20" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <text x="812" y="347" fill="#e2e8f0">Evening wind-down</text>
      <rect x="788" y="372" width="204" height="40" rx="20" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <text x="812" y="399" fill="#e2e8f0">Weekly review notes</text>
    </g>
    <rect x="788" y="436" width="304" height="44" rx="8" fill="#0ea5e9"/>
    <text x="868" y="465" font-size="20" font-weight="700" fill="#020617">Create routine</text>
  </g>
  <text x="80" y="580" font-size="20" fill="#94a3b8">Schematic illustration — not a pixel capture.</text>
</svg>
