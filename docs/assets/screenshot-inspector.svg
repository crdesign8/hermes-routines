  <text x="122" y="562" font-size="21" fill="#cbd5e1">Summarize overnight highlights and list</text>
  <text x="122" y="592" font-size="21" fill="#cbd5e1">the three most important items for today.</text>
  <text x="100" y="656" font-size="20" fill="#94a3b8">Disabled mirror of the composer — editing is not available in this view.</text>
  <text x="100" y="688" font-size="18" fill="#94a3b8">Schematic illustration — not a pixel capture. Sample values are fictional.</text>
