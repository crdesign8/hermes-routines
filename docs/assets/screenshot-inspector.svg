<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Routine inspector schematic</title>
  <desc>Schematic illustration, not a pixel capture: mock of the RoutineInspectorPanel as a read-only disabled mirror of the composer, showing a fictional routine with no editing actions. Mirrors src/views/RoutineInspectorPanel.tsx.</desc>
  <rect x="0" y="0" width="900" height="760" fill="#0f172a"/>
  <rect x="60" y="36" width="780" height="688" rx="16" fill="#020617" stroke="#334155" stroke-width="2"/>
  <rect x="60" y="36" width="780" height="80" rx="16" fill="#1e293b"/>
  <text x="100" y="70" font-size="20" fill="#38bdf8">‹ Back to routines</text>
  <text x="100" y="162" font-size="27" font-weight="700" fill="#f1f5f9">Morning briefing</text>
  <rect x="560" y="132" width="240" height="44" rx="22" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <circle cx="588" cy="154" r="9" fill="#22c55e"/>
  <text x="606" y="161" font-size="19" fill="#94a3b8">Read-only view</text>
  <g opacity="0.92">
    <rect x="100" y="192" width="700" height="64" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="122" y="219" font-size="21" font-weight="600" fill="#cbd5e1">Active</text>
    <text x="122" y="244" font-size="18" fill="#94a3b8">This routine will run on the schedule below.</text>
    <rect x="716" y="204" width="64" height="36" rx="18" fill="#334155"/>
    <circle cx="740" cy="222" r="13" fill="#94a3b8"/>
  </g>
  <text x="100" y="300" font-size="20" font-weight="600" fill="#cbd5e1">Name</text>
  <rect x="100" y="312" width="700" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="122" y="345" font-size="22" fill="#cbd5e1">Morning briefing</text>
  <text x="100" y="408" font-size="20" font-weight="600" fill="#cbd5e1">Schedule</text>
  <rect x="100" y="420" width="700" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="122" y="453" font-size="22" fill="#cbd5e1">Weekdays at 08:00</text>
  <text x="100" y="516" font-size="20" font-weight="600" fill="#cbd5e1">What this routine does</text>
